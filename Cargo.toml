[package]
name = "canonical-pub-lib-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Publishable, client-safe shared Rust primitives for Canonical Cloud"
license = "MIT"
repository = "https://github.com/canonical-cloud/canonical-pub-lib-core"
readme = "README.md"
keywords = ["compliance", "sdk", "contracts", "validation"]
categories = ["data-structures", "development-tools"]

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
