name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require generated RPC evidence to match active source revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source .route-map-sources.lock

          pr_json="$(gh api repos/canonical-cloud/canonical-api-server.rs/pulls/66)"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          merged_at="$(jq -r '.merged_at // empty' <<<"$pr_json")"
          if [[ "$pr_state" == "open" ]]; then
            expected_source_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            source_state="open-pr-head"
          elif [[ -n "$merged_at" ]]; then
            expected_source_sha="$(jq -r '.merge_commit_sha' <<<"$pr_json")"
            source_state="merged-pr-commit"
          else
            echo "::error::canonical-api-server.rs#66 is closed without merge; generated public RPC evidence has no valid rollout authority" >&2
            exit 1
          fi

          manifest_sha="$(jq -er '.source_commit_sha' generated/rpc/regular/manifest.json)"
          audience="$(jq -er '.audience' generated/rpc/regular/manifest.json)"
          scope="$(jq -er '.scope' generated/rpc/regular/manifest.json)"

          test "$CANONICAL_API_SERVER_SHA" = "$expected_source_sha" || {
            echo "::error::.route-map-sources.lock is stale: lock=$CANONICAL_API_SERVER_SHA expected_source=$expected_source_sha source_state=$source_state" >&2
            exit 1
          }
          test "$manifest_sha" = "$expected_source_sha" || {
            echo "::error::generated/rpc/regular/manifest.json is stale: source_commit_sha=$manifest_sha expected_source=$expected_source_sha source_state=$source_state" >&2
            exit 1
          }
          test "$audience" = "public" || {
            echo "::error::public generated RPC audience widened or changed: $audience" >&2
            exit 1
          }
          test "$scope" = "regular" || {
            echo "::error::public generated RPC scope widened or changed: $scope" >&2
            exit 1
          }
          test ! -e generated/rpc/admin || {
            echo "::error::admin RPC evidence must never exist in canonical-pub-lib-core" >&2
            exit 1
          }
          printf 'rpc_source_state=%s\nrpc_source_sha=%s\n' "$source_state" "$expected_source_sha"
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Enforce publishable boundary
        run: bash scripts/check-public-boundary.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features

  rpc-cli-materialize:
    name: deterministic ores-stack RPC materialization
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out client PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare ignored deterministic tool/source work area
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '.rpc-work/' >> .git/info/exclude

      - name: Resolve immutable API source revisions
        id: source
        env:
          GH_TOKEN: ${{ secrets.SYNC_FLEET_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resolve_source() {
            local repo="$1" pr="$2" prefix="$3"
            local payload state merged_at sha
            payload="$(gh api "repos/$repo/pulls/$pr")"
            state="$(jq -r '.state' <<<"$payload")"
            merged_at="$(jq -r '.merged_at // empty' <<<"$payload")"
            if [[ "$state" == "open" ]]; then
              sha="$(jq -r '.head.sha' <<<"$payload")"
            elif [[ -n "$merged_at" ]]; then
              sha="$(jq -r '.merge_commit_sha' <<<"$payload")"
            else
              echo "::error::$repo#$pr is closed without merge" >&2
              exit 1
            fi
            echo "${prefix}_sha=$sha" >> "$GITHUB_OUTPUT"
          }
          resolve_source canonical-cloud/canonical-api-server.rs 66 regular

      - name: Check out exact regular API source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: canonical-cloud/canonical-api-server.rs
          ref: ${{ steps.source.outputs.regular_sha }}
          path: .rpc-work/source-regular
          token: ${{ secrets.SYNC_FLEET_TOKEN || github.token }}
          persist-credentials: false

      - name: Check out immutable ores-stack generator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: 85ed2f3927ca0b4667aed5a2f96c2a47007ea8cc
          path: .rpc-work/ores-stack
          token: ${{ secrets.SYNC_FLEET_TOKEN || github.token }}
          persist-credentials: false

      - name: Install Rust for ores-stack
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable

      - name: Build exact ores-stack CLI
        shell: bash
        run: cargo build --manifest-path .rpc-work/ores-stack/Cargo.toml -p ores-stack-cli --release

      - name: Materialize and prove byte-for-byte determinism
        shell: bash
        run: |
          set -euo pipefail
          ORES_STACK=".rpc-work/ores-stack/target/release/ores-stack"
          "$ORES_STACK" sync --given .rpc-work/source-regular
          "$ORES_STACK" sync --given .rpc-work/source-regular --check
          printf 'CANONICAL_API_SERVER_SHA=%s\n' "${{ steps.source.outputs.regular_sha }}" > .route-map-sources.lock

      - name: Reject non-generator drift
        shell: bash
        run: |
          set -euo pipefail
          bad="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(src/langs/|generated/rpc/|\.route-map-sources\.lock$)' || true)"
          if [[ -n "$bad" ]]; then
            echo "::error::ores-stack materialization changed unexpected paths:"
            echo "$bad"
            exit 1
          fi

      - name: Commit exact ores-stack output
        shell: bash
        run: |
          set -euo pipefail
          git add -A src/langs generated/rpc .route-map-sources.lock
          if git diff --cached --quiet; then
            echo "ores-stack output already current"
            exit 0
          fi
          git config user.name "ores-stack-rpc-bot"
          git config user.email "ores-stack-rpc-bot@users.noreply.github.com"
          git commit -m "chore(rpc): regenerate clients with ores-stack"
          git push origin "HEAD:${{ github.head_ref }}"
